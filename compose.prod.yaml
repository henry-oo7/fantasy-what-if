services:
  database:
    restart: unless-stopped
    ports: []

  migrate:
    image: fantasy-what-if-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fantasy_internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    image: fantasy-what-if-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      SYNC_SCHEDULER_ENABLED: "false"
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fantasy_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  sync-scheduler:
    image: fantasy-what-if-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      SYNC_SCHEDULER_ENABLED: "true"
    command:
      - python
      - -m
      - app.scripts.sync_scheduler
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fantasy_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
